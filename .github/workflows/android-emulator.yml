name: Android emulator preview

on:
  workflow_dispatch:

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        working-directory: android-app
        run: gradle --no-daemon assembleDebug
      - name: Install and capture emulator preview
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: |
            adb install -r android-app/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n com.example.androiddevicemonitor/.ui.MainActivity
            sleep 5
            adb exec-out screencap -p > "$GITHUB_WORKSPACE/android-device-monitor-emulator.png"
      - name: Upload emulator screenshot
        uses: actions/upload-artifact@v4
        with:
          name: android-device-monitor-emulator-preview
          path: android-device-monitor-emulator.png
